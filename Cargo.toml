[package]
name = "snapzy-rust-preview"
version = "0.15.0-alpha.8"
edition = "2024"
license = "MIT"
authors = ["jairlinethai"]
description = "Native Windows capture experiment for SnapZy"
repository = "https://github.com/jairlinethai8989/snapzy-rust"
build = "build.rs"

[[bin]]
name = "snapzy-rust"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
windows-core = "=0.62.2"
png = "=0.18.0"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_System_SystemServices", "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Accessibility", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Security", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem"
] }
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uiautomation = { version = "=0.25.1", default-features = false, features = ["input", "pattern"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Media_MediaFoundation", "Win32_System_Com",
    "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
