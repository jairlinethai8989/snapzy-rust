[package]
name = "snapzy-tauri"
version = "0.15.0-alpha.8"
edition = "2024"
license = "MIT"
description = "SnapZy Windows capture interface built with Tauri and vanilla JavaScript"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
